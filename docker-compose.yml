version: '3.8'

services:
  fraud-detector-api:
    build: .
    container_name: fraud-detector-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./fraud_detection.db:/app/fraud_detection.db
      - ./fraud_detection.log:/app/fraud_detection.log
      - ./api.log:/app/api.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - fraud-detection-net

networks:
  fraud-detection-net:
    driver: bridge
